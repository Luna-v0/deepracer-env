# ros2_control configuration for the DeepRacer car under Gazebo Jetty.
#
# Loaded by the gz_ros2_control::GazeboSimSystem plugin embedded in the robot
# URDF (see urdf/deepracer/deepracer_gz.urdf.xacro). It replaces the legacy
# ros_control YAML (racecar_control_kinematics.yaml).
#
# Controller choice (see project memory "lyrical-jetty-substrate-verified"):
# ros2_controllers 6.7 dropped the velocity_controllers / position_controllers
# convenience packages, so we use the generic forward_command_controller — one
# instance per joint group — commanded with std_msgs/Float64MultiArray. The
# joint ORDER in each `joints:` list is the contract shared with
# deepracer_env/agent_ctrl/drive.py (WHEEL_JOINTS / STEERING_JOINTS).
#
# The Ackermann geometry is realised by the URDF joints (same angle to both
# steering hinges, same angular velocity to all four wheels) — exactly as the
# legacy stack did — so no Ackermann decomposition lives in software.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    wheels_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    steering_position_controller:
      type: forward_command_controller/ForwardCommandController

# Four wheels, velocity command (rad/s). Order == drive.WHEEL_JOINTS.
wheels_velocity_controller:
  ros__parameters:
    joints:
      - left_rear_wheel_joint
      - right_rear_wheel_joint
      - left_front_wheel_joint
      - right_front_wheel_joint
    interface_name: velocity

# Two steering hinges, position command (rad). Order == drive.STEERING_JOINTS.
steering_position_controller:
  ros__parameters:
    joints:
      - left_steering_hinge_joint
      - right_steering_hinge_joint
    interface_name: position
